<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant Soft Meadow / Hi-Yellow subtle backdrop -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F9FBF2" />
      <stop offset="100%" stop-color="#FFE228" stop-opacity="0.22" />
    </linearGradient>

    <!-- Warm Radiant Yellow Pulse Glow -->
    <filter id="yellowGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="pulseYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD600" />
      <stop offset="50%" stop-color="#FFE228" />
      <stop offset="100%" stop-color="#FFF275" />
    </linearGradient>
  </defs>

  <!-- Squircle Container in Brand Soft Canvas with distinct border -->
  <rect width="512" height="512" rx="112" fill="url(#canvasBg)" />
  <rect x="4" y="4" width="504" height="504" rx="108" stroke="#130E30" stroke-opacity="0.14" stroke-width="8" />

  <!-- Bold, High-Contrast Letter 'N' scaled to fill container -->
  <path 
    d="M108 92 H192 L320 318 V92 H404 V420 H320 L192 194 V420 H108 Z" 
    fill="#130E30" 
  />

  <!-- Voice Frequency & Bio-Telemetry Pulse Wave in Signature Radiant Yellow (#FFE228) -->
  <g filter="url(#yellowGlow)">
    <path 
      d="M48 256 H120 L144 230 L168 282 L194 256 L224 196 L250 336 L272 168 L294 336 L318 196 L344 256 L368 282 L392 230 L416 256 H464" 
      fill="none" 
      stroke="url(#pulseYellow)" 
      stroke-width="20" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>

  <!-- Accent Focal Points on the Pulse Line -->
  <circle cx="272" cy="168" r="12" fill="#FFE228" stroke="#130E30" stroke-width="4" />
  <circle cx="48" cy="256" r="9" fill="#FFE228" />
  <circle cx="464" cy="256" r="9" fill="#FFE228" />
</svg>
